<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Why the Distribution Has a Peak</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]] },
      svg: { fontCache: "global" }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --white: #f4f4f2;
      --yellow: #d8df20;
      --muted: #a8a8a2;
      --grid: #3f3f3b;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: "CMU Serif", "Latin Modern Roman", "Computer Modern",
        "STIX Two Text", Georgia, "Times New Roman", serif;
      text-rendering: geometricPrecision;
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: clamp(0.65rem, 1.8vh, 1.2rem);
      padding: clamp(1.1rem, 3.2vh, 2.2rem) clamp(1rem, 3.2vw, 3.5rem)
        clamp(1.1rem, 3vh, 2rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.6vw, 2.35rem);
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
    }

    .equation {
      min-height: 2.4rem;
      color: var(--yellow);
      font-size: clamp(1.05rem, 1.75vw, 1.45rem);
      line-height: 1.25;
      text-align: center;
    }

    .workspace {
      width: min(100%, 1800px);
      min-height: 0;
      justify-self: center;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(14rem, 21vw, 19rem);
      gap: clamp(1.5rem, 3.2vw, 3.5rem);
    }

    .phasor-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #phasorCanvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 270px;
      shape-rendering: geometricPrecision;
    }

    .figure-frame {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1.1;
    }

    .axis {
      stroke: var(--muted);
      stroke-width: 1.1;
      opacity: 0.72;
    }

    .axis-label {
      fill: var(--muted);
      font-family: "CMU Serif", "Latin Modern Roman", "Computer Modern",
        "STIX Two Text", Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
    }

    .origin-label {
      fill: var(--muted);
      font-family: "CMU Serif", "Latin Modern Roman", "Computer Modern",
        "STIX Two Text", Georgia, "Times New Roman", serif;
      font-size: 13px;
    }

    .phasor {
      stroke: var(--white);
      stroke-width: 2.1;
      stroke-linecap: round;
    }

    .resultant {
      stroke: var(--yellow);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .origin { fill: var(--white); }
    .endpoint { fill: var(--yellow); }

    .controls {
      min-width: 0;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.8rem, 4.8vh, 3.6rem);
      border-left: 1px solid var(--grid);
      padding-left: clamp(1.25rem, 2.5vw, 2.4rem);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .vector-key {
      display: grid;
      grid-template-columns: 2.9rem minmax(0, 1fr);
      gap: 0.55rem 0.75rem;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .vector-key mjx-container { color: var(--white); }

    .vector-swatch {
      position: relative;
      width: 2.7rem;
      height: 0;
      border-top: 2px solid var(--white);
    }

    .vector-swatch::after {
      position: absolute;
      top: -5px;
      right: -1px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 7px solid var(--white);
      content: "";
    }

    .vector-swatch.resultant-key {
      border-top-color: var(--yellow);
      border-top-width: 4px;
    }

    .vector-swatch.resultant-key::after {
      top: -6px;
      border-top-width: 5px;
      border-bottom-width: 5px;
      border-left: 8px solid var(--yellow);
    }

    .control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.65rem 0.8rem;
      min-width: 0;
    }

    label {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      min-width: 0;
      margin: 0;
      accent-color: var(--yellow);
      cursor: pointer;
    }

    output {
      min-width: 4.2rem;
      color: var(--yellow);
      font: 600 0.95rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .readout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem 0.8rem;
      align-items: baseline;
      padding-top: 1.1rem;
      border-top: 1px solid var(--grid);
      color: var(--muted);
      font-family: "CMU Serif", "Latin Modern Roman", "Computer Modern",
        "STIX Two Text", Georgia, "Times New Roman", serif;
      font-size: clamp(0.9rem, 1.1vw, 1rem);
    }

    .readout output {
      font-size: 0.95rem;
      text-align: left;
    }

    mjx-container { color: inherit; }
    .controls mjx-container { margin: 0 !important; }

    @media (max-width: 720px) {
      main {
        gap: 0.38rem;
        padding-inline: 0.8rem;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 0.55rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem 1rem;
        border-left: 0;
        border-top: 1px solid var(--grid);
        padding: 0.65rem 0 0;
      }

      .readout { display: none; }
      .vector-key { display: none; }
      #phasorCanvas { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Why the distribution has a peak</h1>
    <div class="equation">
      \(A_y=\frac{1}{N}\sum_{x=0}^{N-1}
      e^{2\pi\mathrm{i}x(\phi-y/N)}\)
    </div>

    <div class="workspace">
      <div class="phasor-wrap">
        <svg id="phasorCanvas" role="img"
          aria-label="Complex-plane sum of individual white phase vectors and the yellow resultant A y">
        </svg>
      </div>

      <div class="controls" aria-label="Phasor sum parameters">
        <div class="vector-key" aria-label="Vector key">
          <span class="vector-swatch" aria-hidden="true"></span>
          <span>individual phasors</span>
          <span class="vector-swatch resultant-key" aria-hidden="true"></span>
          <span>resultant \(A_y\)</span>
        </div>
        <div class="control">
          <label for="phasorCount">N</label>
          <output id="phasorCountValue" for="phasorCount">20</output>
          <input id="phasorCount" type="range" min="1" max="20" step="1" value="20">
        </div>
        <div class="control">
          <label for="phi">Phase &phi;</label>
          <output id="phiValue" for="phi">0.370</output>
          <input id="phi" type="range" min="0" max="1" step="0.001" value="0.370">
        </div>
        <div class="control">
          <label for="labelRatio">Label y/N</label>
          <output id="labelRatioValue" for="labelRatio">0.370</output>
          <input id="labelRatio" type="range" min="0" max="1" step="0.001" value="0.370">
        </div>
        <div class="readout" aria-live="polite">
          <span>\(\Delta=\phi-y/N\)</span>
          <output id="deltaValue">0.000</output>
          <span>\(\lvert A_y\rvert\)</span>
          <output id="amplitudeValue">1.000</output>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const phasorCountInput = document.getElementById("phasorCount");
    const phiInput = document.getElementById("phi");
    const labelRatioInput = document.getElementById("labelRatio");
    const phasorCountValue = document.getElementById("phasorCountValue");
    const phiValue = document.getElementById("phiValue");
    const labelRatioValue = document.getElementById("labelRatioValue");
    const deltaValue = document.getElementById("deltaValue");
    const amplitudeValue = document.getElementById("amplitudeValue");
    const svg = document.getElementById("phasorCanvas");

    function svgElement(name, attributes = {}) {
      const node = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, String(value));
      }
      return node;
    }

    function marker(id, color) {
      const node = svgElement("marker", {
        id,
        viewBox: "0 0 8 8",
        refX: 7,
        refY: 4,
        markerWidth: 8,
        markerHeight: 8,
        orient: "auto",
        markerUnits: "userSpaceOnUse"
      });
      const tip = svgElement("path", { d: "M 0 0 L 8 4 L 0 8 z", fill: color });
      node.appendChild(tip);
      return node;
    }

    function draw() {
      const width = Math.max(320, Math.round(svg.clientWidth));
      const height = Math.max(190, Math.round(svg.clientHeight));
      const phasorCount = Number.parseInt(phasorCountInput.value, 10);
      const phi = Number(phiInput.value);
      const labelRatio = Number(labelRatioInput.value);
      const delta = phi - labelRatio;
      const turn = 2 * Math.PI * delta;

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.replaceChildren();

      const defs = svgElement("defs");
      defs.appendChild(marker("whiteArrow", "#f4f4f2"));
      defs.appendChild(marker("yellowArrow", "#d8df20"));
      defs.appendChild(marker("axisArrow", "#a8a8a2"));
      svg.appendChild(defs);

      const inset = Math.max(16, Math.min(34, width * 0.035));
      svg.appendChild(svgElement("rect", {
        x: inset,
        y: inset,
        width: width - 2 * inset,
        height: height - 2 * inset,
        class: "figure-frame"
      }));

      const points = [{ x: 0, y: 0 }];
      let real = 0;
      let imaginary = 0;
      for (let x = 0; x < phasorCount; x += 1) {
        real += Math.cos(turn * x) / phasorCount;
        imaginary += Math.sin(turn * x) / phasorCount;
        points.push({ x: real, y: imaginary });
      }

      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const innerWidth = width - 2 * inset;
      const innerHeight = height - 2 * inset;
      const originX = inset + innerWidth * 0.16;
      const originY = height / 2;
      const horizontalPadding = 12;
      const verticalPadding = Math.max(32, innerHeight * 0.1);
      const scaleLimits = [
        inset + innerWidth - horizontalPadding - originX
      ];
      if (maxX > 0) {
        scaleLimits.push((inset + innerWidth - horizontalPadding - originX) / maxX);
      }
      if (minX < 0) {
        scaleLimits.push((originX - inset - horizontalPadding) / -minX);
      }
      if (maxY > 0) {
        scaleLimits.push((originY - inset - verticalPadding) / maxY);
      }
      if (minY < 0) {
        scaleLimits.push((inset + innerHeight - verticalPadding - originY) / minY * -1);
      }
      const scale = Math.max(1, Math.min(...scaleLimits));
      const mapPoint = (point) => ({
        x: originX + point.x * scale,
        y: originY - point.y * scale
      });
      const displayPoints = points.map(mapPoint);

      svg.appendChild(svgElement("line", {
        x1: inset + 10,
        y1: originY,
        x2: inset + innerWidth - 13,
        y2: originY,
        class: "axis",
        "marker-end": "url(#axisArrow)"
      }));
      svg.appendChild(svgElement("line", {
        x1: originX,
        y1: inset + innerHeight - 10,
        x2: originX,
        y2: inset + 13,
        class: "axis",
        "marker-end": "url(#axisArrow)"
      }));
      const realLabel = svgElement("text", {
        x: inset + innerWidth - 18,
        y: originY - 11,
        class: "axis-label",
        "text-anchor": "end"
      });
      realLabel.textContent = "Re";
      svg.appendChild(realLabel);
      const imaginaryLabel = svgElement("text", {
        x: originX + 11,
        y: inset + 25,
        class: "axis-label"
      });
      imaginaryLabel.textContent = "Im";
      svg.appendChild(imaginaryLabel);
      const zeroLabel = svgElement("text", {
        x: originX - 9,
        y: originY + 18,
        class: "origin-label",
        "text-anchor": "end"
      });
      zeroLabel.textContent = "0";
      svg.appendChild(zeroLabel);

      for (let i = 0; i < phasorCount; i += 1) {
        const start = displayPoints[i];
        const end = displayPoints[i + 1];
        svg.appendChild(svgElement("line", {
          x1: start.x,
          y1: start.y,
          x2: end.x,
          y2: end.y,
          class: "phasor",
          "marker-end": "url(#whiteArrow)"
        }));
      }

      const chainStart = displayPoints[0];
      const chainEnd = displayPoints[displayPoints.length - 1];
      svg.appendChild(svgElement("line", {
        x1: chainStart.x,
        y1: chainStart.y,
        x2: chainEnd.x,
        y2: chainEnd.y,
        class: "resultant",
        "marker-end": "url(#yellowArrow)"
      }));
      svg.appendChild(svgElement("circle", {
        cx: chainStart.x, cy: chainStart.y, r: 3.2, class: "origin"
      }));
      svg.appendChild(svgElement("circle", {
        cx: chainEnd.x, cy: chainEnd.y, r: 4.2, class: "endpoint"
      }));

      const amplitude = Math.hypot(real, imaginary);
      phasorCountValue.value = String(phasorCount);
      phiValue.value = phi.toFixed(3);
      labelRatioValue.value = labelRatio.toFixed(3);
      deltaValue.value = delta.toFixed(3);
      amplitudeValue.value = amplitude.toFixed(3);
    }

    phasorCountInput.addEventListener("input", draw);
    phiInput.addEventListener("input", draw);
    labelRatioInput.addEventListener("input", draw);
    window.addEventListener("keydown", (event) => {
      if (window.parent === window) return;
      const direction = {
        ArrowRight: "next",
        ArrowDown: "next",
        ArrowLeft: "previous",
        ArrowUp: "previous"
      }[event.key];
      if (!direction) return;
      event.preventDefault();
      event.stopPropagation();
      window.parent.postMessage({ type: "qpe-slide-navigation", direction }, "*");
    }, true);
    new ResizeObserver(draw).observe(svg);
    draw();
  </script>
</body>
</html>
